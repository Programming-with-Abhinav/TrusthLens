<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>TrustLens AI – Extension Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 20px;
      width: 380px;
      box-sizing: border-box;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      box-sizing: border-box;
      margin-bottom: 14px;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }
    .help {
      font-size: 11px;
      color: #64748b;
      margin-top: -10px;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    button {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }
    button:hover {
      opacity: 0.9;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 16px;
      color: #4ade80;
    }
    .footer-link {
      margin-top: 14px;
      font-size: 11px;
      text-align: center;
      color: #94a3b8;
    }
    .footer-link a {
      color: #38bdf8;
      text-decoration: none;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>🛡️ TrustLens Settings</h2>

  <label for="backend-url">Backend Service URL (FR-E3)</label>
  <input type="text" id="backend-url" placeholder="http://localhost:5500" />
  <div class="help">Default: <code>http://localhost:5500</code></div>

  <label for="auth-token">Supabase Auth Bearer Token (FR-E8)</label>
  <textarea id="auth-token" rows="3" placeholder="Optional. Paste token from web dashboard."></textarea>
  <div class="help">Leave blank to use anonymous mode. If provided, usage syncs directly with your account (100% Free &amp; Unlimited).</div>

  <button id="save-btn">Save Preferences</button>
  <div id="status"></div>

  <div class="footer-link">
    Need a token? <a href="http://localhost:3000/dashboard" target="_blank">Open Web Dashboard</a>
  </div>

  <script src="options.js"></script>
</body>
</html>
